<!doctype html>
<html lang="pt-BR">

    <title>Jornada Viagens</title>
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <a class="logo" href="index.html" title="Voltar para pagina inicial"
        ><img
          class="img-mobile"
          src="img/Símbolo_branco.png"
          alt="Símbolo branco da logo Jornada"
        />
        <img
          class="img-desktop"
          src="img/Logo-branco 2.png"
          alt="Logo branca para desktop"
        />
      </a>
      <div class="menu_navegacao">
        <label for="menu">
          <img
            src="img/menu.png"
            alt="Menu hamburguer"

          /> </label
        ><input type="checkbox" id="menu" hidden />
        <nav>
          <ul class="list-links">
            <li>
              <a href="blog.html" target="_blank" title="Acessar pagina Blog"

              >
            </li>
            <li>
              <a

                target="_blank"
                title="Acessar Paginas de viagens"

            </li>
            <li>
              <a href="contato.html" target="_blank" title="Acessar contatos"
                >Contato</a
              >
            </li>
          </ul>
        </nav>
      </div>
    </header>
    <section class="hero">
      <img
        class="hero_img"
        src="img/hero_mobile.jpg"
        alt="Imagem principal de um homem andando de kaiaque"
      />
      <h2>
        Somos uma agência apaixonada por criar viagens inesquecíveis. Do destino
        à seleção das atividades, cuidamos de todos os detalhes para que você
        aproveite ao máximo cada momento da sua jornada!
      </h2>
    </section>
